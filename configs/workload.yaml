# The distributed CFD job.
#
# Deliberately NOT a physics model. It is a bulk-synchronous iterative solver:
# each outer timestep exchanges halos, advances the local subdomain, and closes
# with a global reduction. Every `output_interval` timesteps the fields are
# written out. The CFD framing exists to motivate domain decomposition, which is
# the actual subject of the simulator.
#
#   DATA_LOAD (once)   mesh read + decomposition        -> storage read, node pressure
#   per timestep:
#     HALO_EXCHANGE    6-face neighbour exchange        -> routed flows, link queueing
#     COMPUTE          local kernels over owned cells
#     ALLREDUCE        residual + CFL timestep          -> the synchronisation barrier
#     [OUTPUT]         field write every N timesteps    -> storage queue, node pressure
#
# The barrier relationship holds by construction:
#     iteration_time = max(rank arrival times) + collective_comm_time + output_time

# Descriptive only -- nothing reads this field. The geometry that actually
# matters is set by the periodic wrap in mesh.partition(): a triply periodic
# cube, which is what makes Taylor-Green the honest label here. Every rank has
# six neighbours and none sits on a boundary. A walled case (a lid-driven
# cavity, or Rayleigh-Benard with its plates in z) would contradict that: ranks
# on the boundary would have five neighbours, and the +/-z rack ring would open
# into a chain.
name: cfd-taylor-green-vortex
iterations: 1000
output_interval: 100

# Values reduced in the global collective each timestep (residual norms per
# field plus the CFL-limited timestep). Tiny, so ALLREDUCE is latency-dominated
# and therefore a clean proxy for fabric health.
allreduce_values: 8

# One rank per GPU, mapped so that the longest process-grid axis lies inside a
# node. With an 8 x 4 x 4 grid on 8-GPU nodes this puts the +/-x exchanges on
# NVLink, the +/-y exchanges inside the rack, and the +/-z exchanges across
# racks -- which is why a rack-level fabric fault hits exactly the +/-z traffic
# and leaves intra-node exchanges untouched.
placement: packed

# Optional: run the job on a slice of the cluster instead of all 128 GPUs.
# The cluster itself never changes shape -- unallocated GPUs sit idle at
# idle power and near-inlet temperature, and still appear in telemetry.
# `racks` and `nodes` are mutually exclusive pool restrictions; with
# neither, the pool is the whole cluster. `placement` above chooses how the
# ranks spread over the pool (packed = prefix, scatter = round-robin over
# the pool's racks). Absent, the job occupies every GPU -- the historical
# behaviour, bit for bit.
#
# Example (uncomment to activate): 64 ranks on eight nodes -- both nodes 0-1
# of racks 0 and 1, plus the whole of rack 2, leaving rack 3 idle. The shipped
# runs/ and the README's results tables were produced with the block absent;
# runs made under a different allocation are flagged on the dashboard as
# predating the current configuration.
#
# allocation:
#   n_ranks: 64
#   nodes: ["r0n0", "r0n1", "r1n0", "r1n1", "r2n0", "r2n1", "r2n2", "r2n3"]
#
# Pools can also be whole racks:  racks: [0, 1]

# Other pool shapes:
#   racks: [0, 1]            # restrict by whole racks instead of nodes
