# Scenarios.
#
# GOVERNING RULE: an injection may only perturb PHYSICAL STATE -- achievable
# clock, memory bandwidth, cooling efficiency, link availability -- or the
# WORKLOAD's own parameters. No injection ever writes a telemetry value. Every
# signature in the dashboard is an observed consequence.
#
# The `fault` flag is a ground-truth LABEL used to score the diagnosis view. It
# is never consumed by the simulator itself.
#
# Targeted injections (`target: {rack,node,gpu}` or `target: {rack}`) honour
# the workload allocation: if the named hardware hosts no rank of the job, a
# replacement is drawn from the allocated set with a seed-keyed stream --
# random but reproducible -- and the event payload records `retargeted_from`.
# A fault injected into an idle GPU would be a fault into vacuum: the run
# would complete, nothing would happen, and the FAULT label would sit over a
# perfectly healthy job.

scenarios:

  healthy:
    fault: false
    label: Healthy baseline
    description: >
      Nominal cluster, nominal workload. Establishes the reference for every
      other scenario. Note that storage latency still spikes every 100
      timesteps: field output is a legitimate phase, not a fault.
    injections: []

  straggler:
    fault: true
    tier: rank
    label: Rank-level straggler
    description: >
      A few hosts are left with stale processes from a previous job, and those
      processes wake intermittently to steal SM time. Each episode takes 20-45%
      of one victim's SM throughput for a few timesteps, then releases it
      completely -- between episodes the cluster is bit-for-bit healthy.
      The fault is localised to a small cohort but never continuous, so it is
      real and attributable while still being easy to average away.
      This is deliberately chosen to be INVISIBLE in the clock: the GPU still
      boosts to its nominal clock and never sets a throttle bit; it is simply
      slower while the episode lasts. Its 127 peers are untouched, but the
      barrier means they all wait. The peers report HIGH utilisation (spinning
      in the collective) with FALLING occupancy, power and temperature; the
      victim is the only rank genuinely busy, and the only one running hotter.
      Intermittency is the hard part: any detector that samples slowly enough,
      or averages over a long enough window, sees a slightly noisy healthy
      cluster.
    injections:
      #  From the first timestep: there is no clean warm-up to compare against,
      #  which is the realistic case -- a job inherits whatever was already
      #  running on its hosts. It also means the early-vs-late comparison the
      #  other scenarios lean on reports almost nothing here (+1% iteration
      #  time, spread flat), and the fault is caught instead by counting which
      #  ranks pace the barrier. See metrics.STRAGGLER_DUTY_FLOOR.
      #
      #  Cohort and schedule are both drawn from the run's own seed, so which
      #  GPUs go bad is random but reproducible; see faults._plan_episodes.
      - at_iteration: 1
        type: gpu_throughput_episodes
        victims: 3
        episodes: 26
        duration_iterations: [5, 18]
        factor: [0.55, 0.80]

  network_domain:
    fault: true
    tier: rack
    label: Rack network-domain degradation
    description: >
      An uplink bundle on rack 2's leaf switch fails, leaving the rack on 1 of
      its 8 spine uplinks, and the surviving optic is the marginal one that took
      the bundle down -- it carries traffic with a 2% frame error rate. A leaf
      that was non-blocking is suddenly 8:1 oversubscribed for 32 ranks: queue
      depth climbs, corrupted frames are dropped, and retransmission burns
      further goodput on a link that has none to spare. Because the
      decomposition places +/-z neighbours across racks, this hits exactly the
      +/-z halo exchanges and leaves every intra-node and intra-rack exchange
      untouched. Compute durations never change -- that is what separates a
      fabric fault from a compute fault.
    injections:
      - at_iteration: 300
        type: leaf_uplink_failure
        target: {rack: 2}
        uplinks_active: 1
        error_rate: 0.02

  thermal:
    fault: true
    tier: rack
    label: Thermal throttling (cooling degradation)
    description: >
      Rack 1's cooling degrades to 30% capacity over 60 timesteps. Cold-aisle
      inlet temperature is a rack property, so all 32 GPUs heat together with
      the first-order lag of the thermal model. Once they cross the 84 C
      slowdown threshold, clocks step down, compute slows, and power falls WITH
      the clock -- the paired clock/power drop under sustained load is the
      fingerprint that distinguishes throttling from an idle GPU.
    injections:
      - at_iteration: 250
        type: cooling_degrade
        target: {rack: 1}
        efficiency: 0.30
        ramp_iterations: 60

  gpu_degradation:
    fault: true
    tier: gpu
    label: GPU reliability degradation
    description: >
      One GPU's achievable memory bandwidth falls 15% as row remapping and
      correctable-error handling eat into it, and its reliability governor caps
      the clock at 90%. Because the solver is memory-bandwidth bound, this rank
      slows and strangles the job. On rank spread, wait time and throughput it
      is nearly indistinguishable from `straggler`; what separates them is
      throttle_reason = RELIABILITY and the occupancy drop on the victim itself.
    injections:
      - at_iteration: 350
        type: gpu_reliability_degrade
        target: {rack: 3, node: 1, gpu: 2}
        memory_bandwidth_factor: 0.85
        clock_cap: 0.90

  phase_change:
    fault: false
    tier: workload
    label: Legitimate workload change (output campaign)
    description: >
      NOT A FAULT. At timestep 500 the run switches from periodic checkpointing
      to a full-field output campaign: every 20 timesteps instead of every 100,
      and 4x the data per output because instantaneous fields are written rather
      than restart state. Throughput drops and storage latency rises and STAYS
      risen, because background writeback never fully drains between outputs.
      Every rank is affected identically, so rank spread stays tight; no GPU
      throttles; no link errors; no queue growth in the fabric. A naive detector
      fires on this. The absence of movement in the hardware channels is what
      makes it separable.
    injections:
      - at_iteration: 500
        type: workload_output_change
        output_interval: 20
        output_bytes_scale: 4.0

# Order used by scripts/run_all.py and by the dashboard tabs.
order: [healthy, straggler, network_domain, thermal, gpu_degradation, phase_change]
